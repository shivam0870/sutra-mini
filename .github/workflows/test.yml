name: Test
on: [push, pull_request]

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL, Go race tests, crash recovery and browser E2E
        run: make e2e
      - name: Upload browser evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sutra-e2e-evidence
          path: artifacts/
          if-no-files-found: ignore
